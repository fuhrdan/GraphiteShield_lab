name: GraphiteShield CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 17 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Java environment
        run: java -version

      - name: Compile GraphiteShield Lab
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/classes
          javac -encoding UTF-8 -d build/classes src/GraphiteShieldLab.java

      - name: Package runnable JAR
        shell: bash
        run: |
          jar --create               --file build/GraphiteShield-Lab.jar               --main-class GraphiteShieldLab               -C build/classes .

      - name: Verify packaged JAR
        shell: bash
        run: |
          test -f build/GraphiteShield-Lab.jar
          jar tf build/GraphiteShield-Lab.jar
          jar xf build/GraphiteShield-Lab.jar META-INF/MANIFEST.MF
          grep -q "Main-Class: GraphiteShieldLab" META-INF/MANIFEST.MF

      - name: Upload compiled JAR
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GraphiteShield-Lab-ci-build
          path: build/GraphiteShield-Lab.jar
          retention-days: 7
